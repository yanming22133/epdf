name: Build for Windows & Mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          cd python_backend
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build Python exe
        run: |
          cd python_backend
          pyinstaller epdf_python.spec
          
      - name: Install Node dependencies
        run: npm ci
        
      - name: Build React
        run: npm run build:react
        
      - name: Build Electron (Windows)
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          electron_builder_binaries_mirror: "https://npmmirror.com/mirrors/electron-builder-binaries/"
        run: npx electron-builder --win portable
        
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ePDF-Windows
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Python dependencies
        run: |
          cd python_backend
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build Python binary
        run: |
          cd python_backend
          pyinstaller epdf_python_mac.spec
          
      - name: Install Node dependencies
        run: npm ci
        
      - name: Build React
        run: npm run build:react
        
      - name: Build Electron (Mac)
        run: npx electron-builder --mac dmg --publish never
        
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: ePDF-Mac
          path: dist/*.dmg
